  const isArray = Array.isArray;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      widgetState: state,

    globalThis.dispatchEvent(

    &quot;message&quot;,

      const nextHostPort = ports[0];

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;project-pixel-print&#x27;);
  const button = root.querySelector(&#x27;[data-motion]&#x27;);
  const title = root.querySelector(&#x27;h1&#x27;);
  const label = root.querySelector(&#x27;.title-label&#x27;);
  const titleCanvas = root.querySelector(&#x27;.title-raster&#x27;);
  const motion = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  const threshold = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const tau = Math.PI * 2;
  const cycle = 6600;
  const frames = [...root.querySelectorAll(&#x27;[data-field]&#x27;)].map((canvas, index) =&gt; ({
    canvas, ctx: canvas.getContext(&#x27;2d&#x27;), pitch: index === 0 ? 5 : 4,
    color: [&#x27;#5133bc&#x27;, &#x27;#e3d7ff&#x27;, &#x27;#4931a1&#x27;, &#x27;#e4a8d1&#x27;][index], offset: index * .97
  }));
  const titleFrame = { canvas: titleCanvas, ctx: titleCanvas.getContext(&#x27;2d&#x27;), pitch: 3, color: &#x27;#4830ae&#x27;, offset: .65 };
  const glyph = document.createElement(&#x27;canvas&#x27;);
  const glyphCtx = glyph.getContext(&#x27;2d&#x27;, {willReadFrequently: true});
  let titleMask, playing = !motion.matches, visible = true, elapsed = 610, requested = 0, last = null, lastDraw = -Infinity;

  function resize(frame) {
    frame.w = Math.ceil(frame.canvas.clientWidth);
    frame.h = Math.ceil(frame.canvas.clientHeight);
    frame.canvas.width = frame.w;
    frame.canvas.height = frame.h;
    frame.columns = Math.ceil(frame.w / frame.pitch);
    frame.rows = Math.ceil(frame.h / frame.pitch);
  }

  function buildTitle() {
    const {w, h, columns, rows} = titleFrame;
    if (!w || !h) return;
    glyph.width = w;
    glyph.height = h;
    const css = getComputedStyle(title);
    const value = label.textContent;
    const context = glyphCtx;
    context.font = `${css.fontWeight} ${css.fontSize} ${css.fontFamily}`;
    if (&#x27;letterSpacing&#x27; in context) context.letterSpacing = css.letterSpacing;
    const bounds = context.measureText(value);
    const width = Math.min(label.getBoundingClientRect().width, w - 2);
    const baseline = (h + bounds.actualBoundingBoxAscent - bounds.actualBoundingBoxDescent) / 2;
    context.fillStyle = &#x27;#4931a1&#x27;;
    context.save();
    context.scale(width / bounds.width, 1);
    context.fillText(value, 0, baseline);
    context.restore();
    const data = context.getImageData(0, 0, w, h).data;
    titleMask = new Uint8Array(columns * rows);
    for (let y = 0; y &lt; rows; y++) {
      for (let x = 0; x &lt; columns; x++) {
        const xx = Math.min(w - 1, x * titleFrame.pitch + 1);
        const yy = Math.min(h - 1, y * titleFrame.pitch + 1);
        titleMask[y * columns + x] = data[(yy * w + xx) * 4 + 3] &gt; 200;
      }
    }
    title.setAttribute(&#x27;data-rendered&#x27;, &#x27;&#x27;);
  }

  function pixelField(frame, phase, mask) {
    const {ctx,w,h,rows,columns,pitch,color,offset} = frame;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    
    ctx.fillStyle = color;
    ctx.globalAlpha = mask ? 1 : .82;
    const time = phase + offset;
    for (let y = 0; y &lt; rows; y++) {
      const yy = y * .147;
      const sway = Math.sin(yy * 1.48 - time) * 1.36;
      for (let x = 0; x &lt; columns; x++) {
        if (mask &amp;&amp; !mask[y * columns + x]) continue;
        const xx = x * .141;
        const field = Math.sin(xx + sway + time) + .73 * Math.cos(yy - xx * .53 + time) + .51 * Math.sin(xx * 1.71 + yy * 1.54 - time * 2);
        const bias = threshold[(y &amp; 3) * 4 + (x &amp; 3)] / 16;
        const strength = (field + 1.40) * 1.30 - bias * 1.62;
        if (!mask &amp;&amp; strength &lt;= .18) continue;
        const dot = mask ? Math.max(1.5, Math.min(pitch, 2.9 + strength * .65)) : Math.max(.8, Math.min(pitch, strength * 1.65));
        const inset = (pitch - dot) / 2;
        const drift = mask ? Math.max(0, Math.sin(xx * .42 + yy * .3 - time) - .52) * 7 : 0;
        ctx.fillRect(x * pitch + inset, y * pitch + inset - drift, dot, dot);
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    const phase = elapsed / cycle * tau;
    frames.forEach(frame =&gt; pixelField(frame, phase));
    pixelField(titleFrame, phase, titleMask);
  }
  function redraw() {
    frames.forEach(resize);
    resize(titleFrame);
    buildTitle();
    draw();
  }
  function step(now) {
    requested = 0;
    if (!playing || !visible || document.hidden) return;
    if (last !== null) elapsed = (elapsed + Math.min(100, now - last)) % cycle;
    last = now;
    if (now - lastDraw &gt;= 1000 / 30) {
      draw();
      lastDraw = now;
    }
    requested = requestAnimationFrame(step);
  }
  function sync() {
    button.textContent = playing ? &#x27;모션 일시정지&#x27; : &#x27;모션 재생&#x27;;
    last = null;
    cancelAnimationFrame(requested);
    requested = playing &amp;&amp; visible &amp;&amp; !document.hidden ? requestAnimationFrame(step) : 0;
  }
  if (!titleFrame.ctx || !glyphCtx || frames.some(frame =&gt; !frame.ctx)) {
    button.hidden = true;
    return;
  }
  redraw();
  const sizeObserver = new ResizeObserver(redraw);
  sizeObserver.observe(root.querySelector(&#x27;.portfolio&#x27;));
  document.fonts.ready.then(redraw);
  const observer = new IntersectionObserver(([entry]) =&gt; { visible = entry.isIntersecting; sync(); });
  observer.observe(root);
  document.addEventListener(&#x27;visibilitychange&#x27;, sync);
  motion.addEventListener(&#x27;change&#x27;, event =&gt; { playing = !event.matches; sync(); });
  button.addEventListener(&#x27;click&#x27;, () =&gt; { playing = !playing; sync(); });
  sync();
})();

    return null;
  };

  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {

  };
  const getTooltip = () =&gt; {
